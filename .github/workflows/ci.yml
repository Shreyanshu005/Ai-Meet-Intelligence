name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_meet_intelligence_test
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Run Tests
      env:
        DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/ai_meet_intelligence_test?schema=public
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test_secret
        GROQ_API_KEY: test_groq
        RESEND_API_KEY: test_resend
      run: npx vitest run
