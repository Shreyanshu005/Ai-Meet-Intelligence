version: '3.8'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_meet_intelligence?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret
      - GROQ_API_KEY=your_groq_key
      - RESEND_API_KEY=your_resend_key
      - NODE_ENV=development
    depends_on:
      - db
      - redis
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_meet_intelligence
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
